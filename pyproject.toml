[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["inframirror"]
omit = ["inframirror/llm_engine.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
  "venv",
  "microservices",
  "tests",
  "inframirror/llm_engine.py",
  "inframirror/telemetry_collector.py",
  "inframirror/watcher.py",
  "scripts/run_aiops_scenarios.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S"]
ignore = ["S101", "S603"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = false
warn_unused_ignores = true
exclude = "^(venv|tests)/"
