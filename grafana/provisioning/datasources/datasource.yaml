apiVersion: 1

# Recreate the repository-managed datasource so upgrades from older Grafana
# versions cannot retain an auto-generated UID that breaks provisioned panels.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    orgId: 1
    type: prometheus
    uid: Prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 5s
