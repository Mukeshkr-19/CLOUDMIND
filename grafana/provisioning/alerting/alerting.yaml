apiVersion: 1

contactPoints:
  - name: Discord Alerts
    receivers:
      - uid: discord-receiver
        type: discord
        settings:
          url: "$DISCORD_WEBHOOK_URL"
          message: |
            **Status:** {{ .Status }}
            **Summary:** {{ .Annotations.summary }}
            **Description:** {{ .Annotations.description }}
            💡 CloudMind Monitoring —

groups:
  - orgId: 1
    name: CloudMind Alert Group
    folder: CloudMind Alerts
    interval: 10s
    rules:
      - uid: cpu-alert-rule
        title: HighCPULoad
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 30
              to: 0
            datasourceUid: Prometheus
            model:
              expr: service_cpu_percent >= 85
              intervalMs: 10000
              maxDataPoints: 43200
              refId: A
              type: prometheus
        noDataState: NoData
        execErrState: Alerting
        for: 5s
        annotations:
          summary: "CPU usage exceeded 85% on {{ $labels.service }}"
          description: "The {{ $labels.service }} service is under high CPU load. Check logs or scale resources."
        labels:
          severity: critical

policies:
  - orgId: 1
    receiver: Discord Alerts
    group_by: ['alertname']
    group_wait: 5s
    group_interval: 10s
    repeat_interval: 5m
