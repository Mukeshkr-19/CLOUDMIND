name: CloudMind CI

on:
  push:
    branches:
      - main
      - reliability-security-hardening
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Python tests and compose validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Guard private env files
        run: |
          if git ls-files --error-unmatch .env '.env.*' ':!.env.example' >/dev/null 2>&1; then
            echo "Private env files must not be tracked."
            exit 1
          fi

      - name: Compile Python sources
        run: python -m compileall microservices inframirror tests

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Validate Docker Compose config
        env:
          WHISPER_TOKEN: ci-whisper-token
          GRAFANA_ADMIN_PASSWORD: ci-grafana-password
        run: docker compose config --quiet
