name: CloudMind CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Python tests and compose validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Guard private env files
        run: |
          if git ls-files --error-unmatch .env '.env.*' ':!.env.example' >/dev/null 2>&1; then
            echo "Private env files must not be tracked."
            exit 1
          fi

      - name: Compile Python sources
        run: python -m compileall microservices inframirror scripts tests

      - name: Lint hardened modules
        run: ruff check .

      - name: Type-check hardened modules
        run: mypy inframirror/gemini_client.py inframirror/evidence_grounding.py inframirror/policy_engine.py inframirror/remediation_guard.py

      - name: Run tests with safety-module coverage
        run: >-
          pytest
          --cov=inframirror.gemini_client
          --cov=inframirror.evidence_grounding
          --cov=inframirror.incident_intelligence
          --cov=inframirror.policy_engine
          --cov=inframirror.incident_store
          --cov=inframirror.remediation_guard
          --cov=inframirror.recovery_verifier
          --cov-branch --cov-report=term-missing --cov-fail-under=80

      - name: Run deterministic AIOps scenario matrix
        run: python scripts/run_aiops_scenarios.py --generate-deterministic-report

      - name: Validate Docker Compose config
        env:
          WHISPER_TOKEN: ci-whisper-token
          GRAFANA_ADMIN_PASSWORD: ci-grafana-password
        run: docker compose config --quiet
