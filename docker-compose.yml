x-microservice-resources: &microservice-resources
  resources:
    limits:
      cpus: "0.50"
      memory: 256M
    reservations:
      cpus: "0.10"
      memory: 64M

services:
  frontend:
    build: ./microservices/frontend
    restart: unless-stopped
    ports:
      - "5050:5050"
    volumes:
      - shared-data:/app/shared
    deploy:
      <<: *microservice-resources
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/status', timeout=2)\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  api:
    build: ./microservices/api
    restart: unless-stopped
    ports:
      - "5051:5051"
    deploy:
      <<: *microservice-resources
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5051/status', timeout=2)\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  database:
    build: ./microservices/database
    restart: unless-stopped
    ports:
      - "5052:5052"
    deploy:
      <<: *microservice-resources
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5052/status', timeout=2)\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  cache:
    build: ./microservices/cache
    restart: unless-stopped
    ports:
      - "5053:5053"
    deploy:
      <<: *microservice-resources
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5053/status', timeout=2)\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  auth:
    build: ./microservices/auth
    restart: unless-stopped
    ports:
      - "5054:5054"
    deploy:
      <<: *microservice-resources
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5054/status', timeout=2)\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-storage:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      alertmanager:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  alertmanager:
    image: prom/alertmanager
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - token_escaped=$$(printf '%s' "$$WHISPER_TOKEN" | sed 's/[\\\/&|]/\\&/g') && sed "s|__WHISPER_TOKEN__|$$token_escaped|g" /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml && /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    environment:
      WHISPER_TOKEN: "${WHISPER_TOKEN:?Set WHISPER_TOKEN in .env before starting CloudMind}"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-storage:/alertmanager
    ports:
      - "9093:9093"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:latest
    container_name: cloudmind-grafana-1
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env before starting CloudMind}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  inframirror:
    build:
      context: ./inframirror
      dockerfile: Dockerfile
    image: cloudmind-inframirror:latest
    container_name: cloudmind-inframirror-1
    restart: unless-stopped
    ports:
      - "5055:5055"
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
      auth:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    environment:
      PROM_URL: "http://prometheus:9090"
      HEALING_ENABLED: "true"
      CPU_SOFT_THRESHOLD: "70"
      CPU_HARD_THRESHOLD: "85"
      LAT_WARN_MS: "250"
      LAT_PAIN_MS: "350"
      HEALING_COOLDOWN_SEC: "150"
      WHISPER_TOKEN: "${WHISPER_TOKEN:?Set WHISPER_TOKEN in .env before starting CloudMind}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - shared-data:/app/shared
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

volumes:
  grafana-storage:
  shared-data:
  prometheus-storage:
  alertmanager-storage:
