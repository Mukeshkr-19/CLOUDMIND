<svg width="1400" height="420" viewBox="0 0 1400 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CloudMind cloud infrastructure banner</title>
  <desc id="desc">A polished CloudMind banner showing a cloud infrastructure control plane, observability pipeline, and remediation loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050914"/>
      <stop offset="0.44" stop-color="#081827"/>
      <stop offset="1" stop-color="#101B3F"/>
    </linearGradient>
    <radialGradient id="glowGreen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(208 316) rotate(-14) scale(330 210)">
      <stop stop-color="#00E0A4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00E0A4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1040 128) rotate(20) scale(470 260)">
      <stop stop-color="#77A7FF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#77A7FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#38E6B0" flood-opacity="0.45"/>
    </filter>
    <style>
      .label { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .hair { stroke: #78A6FF; stroke-opacity: 0.24; stroke-width: 2; }
      .route { stroke: #38E6B0; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .route2 { stroke: #7D8CFF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="420" rx="34" fill="url(#bg)"/>
  <rect x="0" y="0" width="1400" height="420" rx="34" fill="url(#glowGreen)"/>
  <rect x="0" y="0" width="1400" height="420" rx="34" fill="url(#glowBlue)"/>

  <path class="hair" d="M0 104C170 158 286 111 438 144C602 179 642 246 808 215C955 188 1025 125 1191 154C1298 172 1345 226 1400 208"/>
  <path class="hair" d="M0 344C155 304 238 328 384 279C526 231 616 151 758 174C904 198 948 308 1100 315C1230 321 1308 251 1400 272"/>

  <g transform="translate(76 90)">
    <text class="label" x="0" y="0" fill="#8EA4B7" font-size="26" font-weight="800" letter-spacing="5">CLOUD INFRA OBSERVABILITY</text>
    <text class="label" x="0" y="74" fill="#F5FBFF" font-size="72" font-weight="900">CloudMind</text>
    <text class="label" x="3" y="121" fill="#C9D7E2" font-size="25" font-weight="600">Closed-loop SRE automation for cloud infrastructure</text>

    <g transform="translate(0 166)">
      <rect x="0" y="0" width="164" height="48" rx="24" fill="#043B32" stroke="#16F2B3" stroke-opacity="0.45"/>
      <circle cx="28" cy="24" r="8" fill="#16F2B3"/>
      <text class="label" x="48" y="31" fill="#D9FFF4" font-size="18" font-weight="800">Prometheus</text>

      <rect x="184" y="0" width="132" height="48" rx="24" fill="#112B4D" stroke="#82B7FF" stroke-opacity="0.48"/>
      <circle cx="212" cy="24" r="8" fill="#82B7FF"/>
      <text class="label" x="232" y="31" fill="#E2EEFF" font-size="18" font-weight="800">Grafana</text>

      <rect x="336" y="0" width="188" height="48" rx="24" fill="#3B2606" stroke="#FFBF4D" stroke-opacity="0.5"/>
      <circle cx="364" cy="24" r="8" fill="#FFBF4D"/>
      <text class="label" x="384" y="31" fill="#FFF0C2" font-size="18" font-weight="800">Auto-remediation</text>
    </g>
  </g>

  <g transform="translate(700 62)" filter="url(#softShadow)">
    <rect x="0" y="0" width="518" height="292" rx="30" fill="#07111F" stroke="#243853" stroke-width="2"/>
    <rect x="27" y="26" width="464" height="240" rx="22" fill="#091827" stroke="#1C344C"/>

    <g transform="translate(67 52)">
      <path d="M104 56C117 28 144 11 176 15C196 -9 232 -5 247 22C280 20 307 43 307 74C307 106 281 130 249 130H98C66 130 40 108 40 80C40 52 70 35 104 56Z" fill="#0D2034" stroke="#7CB7FF" stroke-width="3"/>
      <text class="label" x="109" y="83" fill="#EAF5FF" font-size="22" font-weight="850">CloudMind</text>
    </g>

    <g transform="translate(44 178)">
      <rect x="0" y="0" width="82" height="58" rx="16" fill="#071D2C" stroke="#16F2B3"/>
      <text class="mono" x="21" y="36" fill="#16F2B3" font-size="15" font-weight="800">FE</text>
      <rect x="104" y="0" width="82" height="58" rx="16" fill="#071D2C" stroke="#82B7FF"/>
      <text class="mono" x="126" y="36" fill="#82B7FF" font-size="15" font-weight="800">API</text>
      <rect x="208" y="0" width="82" height="58" rx="16" fill="#071D2C" stroke="#FFBF4D"/>
      <text class="mono" x="231" y="36" fill="#FFBF4D" font-size="15" font-weight="800">DB</text>
      <rect x="312" y="0" width="82" height="58" rx="16" fill="#071D2C" stroke="#A58BFF"/>
      <text class="mono" x="325" y="36" fill="#A58BFF" font-size="15" font-weight="800">CACHE</text>
      <rect x="416" y="0" width="82" height="58" rx="16" fill="#071D2C" stroke="#FF6B7A"/>
      <text class="mono" x="438" y="36" fill="#FF6B7A" font-size="15" font-weight="800">AUTH</text>
    </g>

    <path class="route" d="M214 182C231 154 261 148 288 170"/>
    <path class="route2" d="M260 182C276 155 317 142 360 160"/>
    <path class="route" d="M298 182C334 156 395 152 447 172"/>

    <g transform="translate(382 39)" filter="url(#nodeGlow)">
      <circle cx="0" cy="0" r="8" fill="#16F2B3"/>
      <circle cx="0" cy="0" r="20" stroke="#16F2B3" stroke-opacity="0.26"/>
    </g>
    <g transform="translate(408 90)">
      <rect x="0" y="0" width="62" height="34" rx="17" fill="#122339" stroke="#355C82"/>
      <text class="mono" x="14" y="22" fill="#CDE7FF" font-size="12" font-weight="800">SLO</text>
    </g>
  </g>

  <g transform="translate(1060 308)">
    <rect x="0" y="0" width="178" height="46" rx="23" fill="#031A16" stroke="#16F2B3" stroke-opacity="0.5"/>
    <text class="mono" x="22" y="29" fill="#BCFFF0" font-size="14" font-weight="800">detect -> explain -> heal</text>
  </g>
</svg>
