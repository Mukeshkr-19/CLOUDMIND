<svg width="1400" height="520" viewBox="0 0 1400 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CloudMind incident dialogue preview</title>
  <desc id="desc">A polished incident dialogue panel showing five service voices and an InfraMirror remediation line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050A13"/>
      <stop offset="1" stop-color="#101B3F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <style>
      .label { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1400" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="122" cy="418" r="250" fill="#16F2B3" opacity="0.08"/>
  <circle cx="1128" cy="70" r="280" fill="#6B83FF" opacity="0.12"/>

  <g transform="translate(64 54)">
    <text class="label" x="0" y="0" fill="#F4FAFF" font-size="32" font-weight="900">Incident Dialogue Record</text>
    <text class="label" x="0" y="34" fill="#A9B9C8" font-size="16" font-weight="650">Telemetry becomes readable system context before remediation runs.</text>
  </g>

  <g transform="translate(64 126)" filter="url(#shadow)">
    <rect x="0" y="0" width="1272" height="330" rx="24" fill="#07111F" stroke="#20364C"/>
    <g transform="translate(28 28)">
      <rect x="0" y="0" width="1216" height="48" rx="16" fill="#101D30" stroke="#273C55"/>
      <text class="mono" x="20" y="30" fill="#FFBF4D" font-size="14" font-weight="850">incident=database cpu=91.2 latency=401ms source=prometheus action=restart-container</text>
    </g>

    <g transform="translate(28 96)">
      <rect x="0" y="0" width="586" height="58" rx="16" fill="#0B2035" stroke="#284B70"/>
      <circle cx="28" cy="29" r="9" fill="#78B9FF"/>
      <text class="mono" x="52" y="25" fill="#78B9FF" font-size="14" font-weight="850">Logic - API</text>
      <text class="label" x="52" y="44" fill="#DCEEFF" font-size="13">Gateway pressure is rising. Database calls are stretching the request path.</text>
    </g>
    <g transform="translate(658 96)">
      <rect x="0" y="0" width="586" height="58" rx="16" fill="#2C1F08" stroke="#5C4217"/>
      <circle cx="28" cy="29" r="9" fill="#FFBF4D"/>
      <text class="mono" x="52" y="25" fill="#FFBF4D" font-size="14" font-weight="850">Memory - Database</text>
      <text class="label" x="52" y="44" fill="#FFF1CF" font-size="13">Write locks are stacking. Index scans need relief before latency spreads.</text>
    </g>

    <g transform="translate(28 172)">
      <rect x="0" y="0" width="586" height="58" rx="16" fill="#181638" stroke="#3A3374"/>
      <circle cx="28" cy="29" r="9" fill="#A58BFF"/>
      <text class="mono" x="52" y="25" fill="#A58BFF" font-size="14" font-weight="850">Swift - Cache</text>
      <text class="label" x="52" y="44" fill="#EEE9FF" font-size="13">Cache pools are absorbing repeated reads while the database recovers.</text>
    </g>
    <g transform="translate(658 172)">
      <rect x="0" y="0" width="586" height="58" rx="16" fill="#32131A" stroke="#68303A"/>
      <circle cx="28" cy="29" r="9" fill="#FF6B7A"/>
      <text class="mono" x="52" y="25" fill="#FF6B7A" font-size="14" font-weight="850">Gatekeeper - Auth</text>
      <text class="label" x="52" y="44" fill="#FFEAF0" font-size="13">Session checks are stable. I am watching for cascading auth delay.</text>
    </g>

    <g transform="translate(28 248)">
      <rect x="0" y="0" width="1216" height="58" rx="16" fill="#0A2B25" stroke="#1E6958"/>
      <circle cx="28" cy="29" r="9" fill="#16F2B3"/>
      <text class="mono" x="52" y="25" fill="#16F2B3" font-size="14" font-weight="850">InfraMirror - SRE</text>
      <text class="label" x="52" y="44" fill="#D9FFF4" font-size="13">Critical threshold confirmed. Remediation started with cooldown protection and incident memory persisted.</text>
    </g>
  </g>
</svg>
