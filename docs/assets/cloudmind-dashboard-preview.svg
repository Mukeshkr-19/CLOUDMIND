<svg width="1400" height="760" viewBox="0 0 1400 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CloudMind operator console preview</title>
  <desc id="desc">A cloud infrastructure dashboard preview with service health cards, telemetry panels, alert routing, and incident dialogue.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1400" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050A13"/>
      <stop offset="0.55" stop-color="#071522"/>
      <stop offset="1" stop-color="#0D1731"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0D1E31"/>
      <stop offset="1" stop-color="#07101C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .label { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .panel { fill: url(#panel); stroke: #20364C; stroke-width: 1.4; }
      .muted { fill: #8CA2B5; }
      .line { stroke: #233B54; stroke-width: 2; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1400" height="760" rx="34" fill="url(#page)"/>
  <circle cx="187" cy="139" r="230" fill="#00E0A4" opacity="0.08"/>
  <circle cx="1148" cy="114" r="290" fill="#6B83FF" opacity="0.12"/>

  <g transform="translate(52 44)">
    <text class="label" x="0" y="0" fill="#F4FAFF" font-size="34" font-weight="900">CloudMind Control Plane</text>
    <text class="label" x="0" y="36" fill="#A9B9C8" font-size="16" font-weight="600">Five services, telemetry ingestion, alert routing, and closed-loop remediation</text>
  </g>

  <g transform="translate(52 112)" filter="url(#shadow)">
    <rect class="panel" x="0" y="0" width="292" height="598" rx="22"/>
    <text class="label" x="24" y="40" fill="#E9F5FF" font-size="20" font-weight="850">Service Fleet</text>
    <text class="label muted" x="24" y="67" font-size="13" font-weight="650">container health and endpoint surface</text>

    <g transform="translate(24 102)">
      <rect x="0" y="0" width="244" height="72" rx="16" fill="#0A2B25" stroke="#16F2B3" stroke-opacity="0.55"/>
      <circle cx="31" cy="36" r="9" fill="#16F2B3"/>
      <text class="label" x="54" y="31" fill="#E8FFF8" font-size="16" font-weight="850">Frontend</text>
      <text class="mono" x="54" y="53" fill="#95DDCE" font-size="12">5050 /metrics</text>
    </g>
    <g transform="translate(24 190)">
      <rect x="0" y="0" width="244" height="72" rx="16" fill="#0B2138" stroke="#78B9FF" stroke-opacity="0.55"/>
      <circle cx="31" cy="36" r="9" fill="#78B9FF"/>
      <text class="label" x="54" y="31" fill="#E8F3FF" font-size="16" font-weight="850">API Gateway</text>
      <text class="mono" x="54" y="53" fill="#9BCBFF" font-size="12">5051 /load</text>
    </g>
    <g transform="translate(24 278)">
      <rect x="0" y="0" width="244" height="72" rx="16" fill="#2C1F08" stroke="#FFBF4D" stroke-opacity="0.55"/>
      <circle cx="31" cy="36" r="9" fill="#FFBF4D"/>
      <text class="label" x="54" y="31" fill="#FFF1CF" font-size="16" font-weight="850">Database</text>
      <text class="mono" x="54" y="53" fill="#F3CA78" font-size="12">5052 /incident</text>
    </g>
    <g transform="translate(24 366)">
      <rect x="0" y="0" width="244" height="72" rx="16" fill="#181638" stroke="#A58BFF" stroke-opacity="0.55"/>
      <circle cx="31" cy="36" r="9" fill="#A58BFF"/>
      <text class="label" x="54" y="31" fill="#F0ECFF" font-size="16" font-weight="850">Cache</text>
      <text class="mono" x="54" y="53" fill="#BCAEFF" font-size="12">5053 /stress</text>
    </g>
    <g transform="translate(24 454)">
      <rect x="0" y="0" width="244" height="72" rx="16" fill="#32131A" stroke="#FF6B7A" stroke-opacity="0.55"/>
      <circle cx="31" cy="36" r="9" fill="#FF6B7A"/>
      <text class="label" x="54" y="31" fill="#FFEAF0" font-size="16" font-weight="850">Auth Manager</text>
      <text class="mono" x="54" y="53" fill="#FF9CAB" font-size="12">5054 /heal</text>
    </g>
  </g>

  <g transform="translate(376 112)" filter="url(#shadow)">
    <rect class="panel" x="0" y="0" width="522" height="282" rx="22"/>
    <text class="label" x="24" y="40" fill="#E9F5FF" font-size="20" font-weight="850">Telemetry Stream</text>
    <text class="label muted" x="24" y="67" font-size="13" font-weight="650">Prometheus scrape signals and alert thresholds</text>

    <g transform="translate(28 104)">
      <path d="M0 122C52 80 103 94 151 69C204 42 247 23 306 48C360 71 397 101 466 45" stroke="#16F2B3" stroke-width="4" stroke-linecap="round"/>
      <path d="M0 146C67 143 115 134 166 118C227 98 281 124 332 104C386 84 424 74 466 88" stroke="#78B9FF" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="154" x2="466" y2="154" class="line"/>
      <line x1="0" y1="18" x2="0" y2="154" class="line"/>
      <text class="mono" x="16" y="24" fill="#8CA2B5" font-size="12">cpu</text>
      <text class="mono" x="410" y="177" fill="#8CA2B5" font-size="12">latency</text>
    </g>
  </g>

  <g transform="translate(928 112)" filter="url(#shadow)">
    <rect class="panel" x="0" y="0" width="420" height="282" rx="22"/>
    <text class="label" x="24" y="40" fill="#E9F5FF" font-size="20" font-weight="850">Alert Routing</text>
    <text class="label muted" x="24" y="67" font-size="13" font-weight="650">Prometheus to Alertmanager to InfraMirror</text>

    <g transform="translate(34 112)">
      <rect x="0" y="0" width="108" height="64" rx="16" fill="#0A2B25" stroke="#16F2B3"/>
      <text class="label" x="17" y="39" fill="#D9FFF4" font-size="15" font-weight="850">Prometheus</text>
      <path d="M123 32H166" stroke="#6B83FF" stroke-width="4" stroke-linecap="round"/>
      <path d="M160 24L170 32L160 40" stroke="#6B83FF" stroke-width="4" stroke-linecap="round"/>
      <rect x="180" y="0" width="124" height="64" rx="16" fill="#122037" stroke="#78B9FF"/>
      <text class="label" x="199" y="39" fill="#E7F3FF" font-size="15" font-weight="850">Alertmanager</text>
      <path d="M242 78V112" stroke="#FFBF4D" stroke-width="4" stroke-linecap="round"/>
      <path d="M234 106L242 116L250 106" stroke="#FFBF4D" stroke-width="4" stroke-linecap="round"/>
      <rect x="154" y="130" width="176" height="56" rx="16" fill="#2C1F08" stroke="#FFBF4D"/>
      <text class="label" x="184" y="164" fill="#FFF1CF" font-size="15" font-weight="850">InfraMirror /whisper</text>
    </g>
  </g>

  <g transform="translate(376 424)" filter="url(#shadow)">
    <rect class="panel" x="0" y="0" width="972" height="286" rx="22"/>
    <text class="label" x="24" y="40" fill="#E9F5FF" font-size="20" font-weight="850">Incident Timeline</text>
    <text class="label muted" x="24" y="67" font-size="13" font-weight="650">character dialogue plus SRE remediation context</text>

    <g transform="translate(24 98)">
      <rect x="0" y="0" width="924" height="48" rx="14" fill="#0B2035" stroke="#20364C"/>
      <text class="mono" x="18" y="30" fill="#78B9FF" font-size="14" font-weight="800">[Logic - API]</text>
      <text class="label" x="142" y="30" fill="#E6F3FF" font-size="14">Routing latency is rising. Query pressure is backing up across the gateway.</text>
    </g>
    <g transform="translate(24 158)">
      <rect x="0" y="0" width="924" height="48" rx="14" fill="#2C1F08" stroke="#574017"/>
      <text class="mono" x="18" y="30" fill="#FFBF4D" font-size="14" font-weight="800">[Memory - DB]</text>
      <text class="label" x="142" y="30" fill="#FFF2CF" font-size="14">Write-lock contention detected. The cache layer should absorb repeated reads.</text>
    </g>
    <g transform="translate(24 218)">
      <rect x="0" y="0" width="924" height="48" rx="14" fill="#0A2B25" stroke="#1D5B4C"/>
      <text class="mono" x="18" y="30" fill="#16F2B3" font-size="14" font-weight="800">[InfraMirror]</text>
      <text class="label" x="142" y="30" fill="#D8FFF4" font-size="14">Critical threshold crossed. Restart queued with cooldown protection enabled.</text>
    </g>
  </g>
</svg>
