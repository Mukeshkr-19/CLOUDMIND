global:
  resolve_timeout: 1m

route:
  receiver: cloudmind-whisper
  group_by: ['alertname', 'service', 'instance']
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 5m

inhibit_rules:
  - source_matchers:
      - alertname="ServiceDown"
    target_matchers:
      - alertname=~"ElevatedCPULoad|CriticalCPULoad|HighResponseLatency"
    equal: ['service']

receivers:
  - name: cloudmind-whisper
    webhook_configs:
      - url: http://inframirror:5055/whisper
        http_config:
          authorization:
            type: Bearer
            credentials: __WHISPER_TOKEN__
        send_resolved: false
